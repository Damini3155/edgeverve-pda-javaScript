<!DOCTYPE html>
<html>
<head>
    <title>DOM3.1</title>
</head>

<body>
    <h2 id="id1"></h2>

    <script>
        const params = new URLSearchParams(window.location.search);

        const name = params.get("name");
        const sid = params.get("sid");

        document.getElementById("id1").innerHTML =
            `Hello name is ${name} and id is ${sid}`;
    </script>
</body>
</html>
