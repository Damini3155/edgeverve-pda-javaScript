<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dom5</title>
</head>
<body>
    <h1>Student Details</h1>
    <form id="id1" action="dom51.html" method="get" onsubmit="saveData()">
        <label>Name:</label>
        <input type="text" id="name" name="name"/>
        <br>
        <label>StudentID:</label>
        <input type="text" id="sid" name="sid"/>
        <input type="submit">
    </form>
    <h2></h2>
    <script>
        function saveData(){
            //localStorage - browser feature to store data in key value pairs
            localStorage.setItem("name",document.getElementById("name").value);
            localStorage.setItem("sid",document.getElementById("sid").value);
        }
    </script>
</body>
</html>
