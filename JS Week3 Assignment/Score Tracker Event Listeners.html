<!DOCTYPE html>
<html>
<head>
    <title>Student Score Tracker</title>

    <style>
        body {
            font-family: Arial;
        }

        #container {
            width: 350px;
            margin: 20px auto;
            padding: 25px;
            background: linear-gradient(to right, #ffcc70, #ff9f7f);
            border-radius: 5px;
            text-align: center;
        }

        h2 {
            color: white;
        }

        input {
            padding: 10px;
            width: 100px;
            margin: 5px;
            border: none;
            border-radius: 5px;
        }

        button {
            padding: 10px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        li {
            list-style: none;
            background-color: #ffe8d2;
            margin: 5px;
            padding: 6px;
            text-align: left;
            border-radius: 5px;
            cursor: pointer;
        }

        #error {
            color: red;
            font-weight: bold;
        }

        #average {
            color: white;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div id="container">

        <h2>🎓 Student Score Tracker</h2>

        <form id="studentForm">

            <input
                type="text"
                id="name"
                placeholder="Student Name"
            >

            <input
                type="text"
                id="score"
                placeholder="Score"
            >

            <button type="submit">Add</button>

        </form>

        <p id="error"></p>

        <ul id="studentList"></ul>

        <p id="average">Average Score: 0</p>

    </div>


    <script>

        let students = [];

        const form = document.getElementById("studentForm");
        const nameInput = document.getElementById("name");
        const scoreInput = document.getElementById("score");
        const studentList = document.getElementById("studentList");
        const error = document.getElementById("error");
        const average = document.getElementById("average");


        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const name = nameInput.value.trim();
            const score = Number(scoreInput.value);

            error.innerHTML = "";

            // Validation
            if (name === "") {
                error.innerHTML = "Student name cannot be empty";
                return;
            }

            if (scoreInput.value === "" || isNaN(score)) {
                error.innerHTML = "Score must be a valid number";
                return;
            }

            if (score < 0) {
                error.innerHTML = "Score cannot be negative";
                return;
            }

            // Add student to array
            students.push({
                name: name,
                score: score
            });

            updateList();

            nameInput.value = "";
            scoreInput.value = "";

        });


        function updateList() {

            studentList.innerHTML = "";

            let total = 0;

            students.forEach(function(student, index) {

                const li = document.createElement("li");

                li.innerHTML = student.name + " - " + student.score;

                // Double click to remove
                li.addEventListener("dblclick", function() {

                    students.splice(index, 1);

                    updateList();

                });

                studentList.appendChild(li);

                total += student.score;

            });


            // Calculate average
            if (students.length > 0) {

                const avg = total / students.length;

                average.innerHTML =
                    "Average Score of " +
                    students.length +
                    " Students: " +
                    avg.toFixed(2);

            } else {

                average.innerHTML = "Average Score: 0";

            }

        }

    </script>

</body>
</html>
